<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autodiagnostic - Tech incendie</title>
<style>body{font-family:'Segoe UI',sans-serif;background:#111;color:#eee;padding:1.5rem;max-width:800px;margin:auto}h1{color:#ff6f00}td,th{padding:.5rem;border-bottom:1px solid #333;font-size:.85rem;text-align:left}.ok{color:#4caf50;font-weight:700}.ko{color:#ff5252;font-weight:700}.warn{color:#ffb300;font-weight:700}#verdict{margin:1rem 0;padding:1rem;border-radius:8px;font-weight:700}button{padding:.8rem 1.5rem;background:#ff6f00;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:.5rem 0}pre{background:#222;padding:1rem;border-radius:8px;overflow:auto;font-size:.75rem}</style>
</head><body>
<h1>🩺 Autodiagnostic Tech incendie v7</h1>
<p>Contrôle automatique : fichiers, manifest, icônes, Service Worker, photos réelles.</p>
<button onclick="run()">▶ LANCER L'AUTOVÉRIFICATION</button>
<div id="verdict"></div><div id="out"></div><pre id="report"></pre>
<script>
const CORE=['index.html','manifest.json','service-worker.js','css/styles.css','js/app.js','js/database.js','js/vehicle-expert.js','js/photos-reelles.js','js/gemini-search.js','images/icon.svg','images/icon-192x192.png','images/icon-512x512.png','images/apple-touch-icon.png'];
let LOG=[];
function line(ok,txt){LOG.push((ok?'[OK] ':'[KO] ')+txt);return `<tr><td class="${ok==='OK'?'ok':ok==='WARN'?'warn':'ko'}">${ok}</td><td>${txt}</td></tr>`;}
async function status(u){try{const r=await fetch(u,{cache:'no-store'});return r.ok?200:r.status;}catch(e){return 'ERR';}}
async function run(){
 LOG=[];let rows='',ko=0;
 for(const f of CORE){const s=await status(f);const ok=s===200;if(!ok)ko++;rows+=line(ok?'OK':'KO',`${f} → HTTP ${s}`);}
 const m=await fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
 if(m){rows+=line(m.name.includes('Tech')?'OK':'KO',`Manifest name = "${m.name}"`);
  for(const ic of m.icons){const s=await status(ic.src);if(s!==200){ko++;rows+=line('KO',`Icône ${ic.src} → HTTP ${s}`);}}
  rows+=line('OK',`${m.icons.length} icônes déclarées, toutes testées`);
 }else{ko++;rows+=line('KO','manifest.json illisible');}
 let sw='KO';
 if(navigator.serviceWorker){const r=await navigator.serviceWorker.getRegistration();sw=r&&r.active?'OK':'KO';}
 if(sw==='KO')ko++;
 rows+=line(sw,`Service Worker actif = ${sw==='OK'?'OUI':'NON'}`);
 rows+=line(typeof FIRE_DATABASE!=='undefined'?'OK':'KO','Globals FIRE_DATABASE');
 rows+=line(typeof VEHICLE_EXPERT!=='undefined'?'OK':'KO','Globals VEHICLE_EXPERT');
 rows+=line(typeof PHOTOS!=='undefined'&&Object.keys(PHOTOS).length>40?'OK':'KO',`PHOTOS = ${typeof PHOTOS!=='undefined'?Object.keys(PHOTOS).length:0} clés`);
 let bad=0,tot=0;
 if(typeof PHOTOS!=='undefined'&&navigator.onLine){for(const k in PHOTOS){tot++;try{await fetch(PHOTOS[k].url,{mode:'no-cors',cache:'no-store'});}catch(e){bad++;rows+=line('KO',`Photo injoignable : ${k}`);}}}
 rows+=line(bad===0?'OK':'WARN',`Photos réelles testées : ${tot-bad}/${tot} accessibles`);
 document.getElementById('out').innerHTML='<table>'+rows+'</table>';
 const v=document.getElementById('verdict');
 if(ko===0){v.style.background='#1b5e20';v.textContent='✅ SYSTÈME CONFORME : prêt pour PWABuilder (Android/Windows/iOS).';}
 else{v.style.background='#b71c1c';v.textContent=`❌ ${ko} anomalie(s) bloquante(s). Corrigez les lignes KO ci-dessous puis relancez.`;}
 document.getElementById('report').textContent=LOG.join('\n');
}
</script></body></html>
